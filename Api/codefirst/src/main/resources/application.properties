server.port=8082

spring.application.name=codefirst

# Poprawny adres JDBC (bez adresu strony phpMyAdmin)
spring.datasource.url=jdbc:mysql://localhost:3306/olx_copy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Dane logowania, o których wspomniałeś
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Konfiguracja Hibernate (Code-First)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Opcjonalne: Pokazywanie zapytań SQL w konsoli
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
debug=false